<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Cryo-EM logo mark (gold and black)</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#ffe08a"/>
      <stop offset="0.6" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#c98f1c"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#a87414"/>
    </linearGradient>
    <radialGradient id="ink" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#211c12"/>
      <stop offset="0.6" stop-color="#0d0b08"/>
      <stop offset="1" stop-color="#040404"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f2c14e" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- hexagon badge -->
  <polygon points="256,10 469,133 469,379 256,502 43,379 43,133" fill="#7a5410"/>
  <polygon points="256,20 460,138 460,374 256,492 52,374 52,138" fill="url(#gold)"/>
  <polygon points="256,34 448,145 448,367 256,478 64,367 64,145" fill="url(#ink)"/>
  <polygon points="256,50 434,153 434,359 256,462 78,359 78,153" fill="none" stroke="#c98f1c" stroke-width="3"/>

  <!-- tilt-series arc around the sample -->
  <path d="M 172 314 A 96 96 0 0 1 340 314" fill="none" stroke="#c98f1c" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.9"/>

  <!-- electron beam -->
  <polygon points="250,226 262,226 314,332 198,332" fill="url(#beam)"/>
  <line x1="256" y1="230" x2="256" y2="318" stroke="#fff3c4" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- microscope column -->
  <rect x="214" y="76" width="84" height="24" rx="7" fill="url(#gold)" stroke="#7a5410" stroke-width="3"/>
  <rect x="230" y="98" width="52" height="104" fill="url(#goldSide)" stroke="#7a5410" stroke-width="3"/>
  <rect x="218" y="126" width="76" height="16" rx="5" fill="url(#gold)" stroke="#7a5410" stroke-width="3"/>
  <rect x="218" y="164" width="76" height="16" rx="5" fill="url(#gold)" stroke="#7a5410" stroke-width="3"/>
  <polygon points="236,200 276,200 266,226 246,226" fill="url(#goldSide)" stroke="#7a5410" stroke-width="3" stroke-linejoin="round"/>
  <rect x="236" y="102" width="6" height="96" fill="#fff3c4" opacity="0.7"/>

  <!-- snowflake (frozen sample) -->
  <g transform="translate(256 362)" stroke="#f5c95a" stroke-linecap="round" fill="none">
    <g id="arm">
      <line x1="0" y1="0" x2="0" y2="-66" stroke-width="10"/>
      <line x1="0" y1="-38" x2="-19" y2="-56" stroke-width="7"/>
      <line x1="0" y1="-38" x2="19" y2="-56" stroke-width="7"/>
      <line x1="0" y1="-18" x2="-12" y2="-30" stroke-width="6"/>
      <line x1="0" y1="-18" x2="12" y2="-30" stroke-width="6"/>
    </g>
    <use href="#arm" xlink:href="#arm" transform="rotate(60)"/>
    <use href="#arm" xlink:href="#arm" transform="rotate(120)"/>
    <use href="#arm" xlink:href="#arm" transform="rotate(180)"/>
    <use href="#arm" xlink:href="#arm" transform="rotate(240)"/>
    <use href="#arm" xlink:href="#arm" transform="rotate(300)"/>
  </g>
  <polygon points="256,346 270,354 270,370 256,378 242,370 242,354" fill="#0d0b08" stroke="#ffe08a" stroke-width="4"/>
  <circle cx="256" cy="362" r="4" fill="#ffe08a"/>
</svg>
